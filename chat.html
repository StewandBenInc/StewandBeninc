<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <title>©Stew and Ben inc.®™</title>
    <script src="https://chitchatter.im/sdk.js" defer></script>
</head>
<body>
    <script src="/navbar.js"></script>
<chat-room
  room="stewandbeninc"                  
  root-url="https://chitchatter.im/"  
  play-message-sound="true"   
  color-mode="dark"         
  height="960"
  width="100%"
  style="border:none;"
></chat-room>
<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const username = getCookie("username");
    if (username) {
      const chat = document.querySelector('chat-room');
      if (chat) {
        chat.setAttribute('user-name', username);
      }
    }
  });
</script>
</body>
</html>

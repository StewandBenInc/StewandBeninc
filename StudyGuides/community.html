<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>©Stew and Ben inc.®™ | Study Guides | Community Submissions</title>
        <link rel="icon" type="image/x-icon" href="../logo.png">
        <link rel="stylesheet" href="../style.css">
        <script src="../navbar.js"></script>
        <script src="community.js"></script>
    </head>
    <body>
        <div class="mainbody" style="margin-top: 75px;">
            <h1>Community Submissions</h1>
            <p>Submit your own study guides here!</p>
            <input type="text" id="name" required placeholder="First and Last Name">
            <br>
            <input type="text" id="email" required placeholder="Email Address">
            <br>
            <input type="text" id="subject" required placeholder="Subject">
            <br>
            <textarea id="content" required placeholder="Content"></textarea>
            <br>
            <button id="submit">Submit</button>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>©Stew and Ben inc.®™ | Study Guides | Community Submissions</title>
        <link rel="icon" type="image/x-icon" href="../logo.png">
        <link rel="stylesheet" href="../style.css">
        <script src="../navbar.js"></script>
        <script src="community.js"></script>
    </head>
    <body>
        <div class="mainbody" style="margin-top: 75px;">
            <h1>Community Submissions</h1>
            <p>Submit your own study guides here!</p>
            <input type="text" id="name" required placeholder="First and Last Name">
            <br>
            <input type="text" id="email" required placeholder="Email Address">
            <br>
            <input type="text" id="subject" required placeholder="Subject">
            <br>
            <input type="text" id="title" required placeholder="Title">
            <br>
            <div id="headings">
                <input type="text" id="heading1" class="heading" oninput="collectData(false,true)" required placeholder="Heading 1">
                <div id="subheadinglistheading1">
                    <input type="text" id="subheading1heading1" oninput="collectData(false,true)" class="subheading" required placeholder="Subheading 1 in Heading 1">
                    <br>
                    <div id="itemlistsubheading1heading1">
                        <textarea id="item1subheading1heading1" class="item" oninput="collectData(false,true)" required placeholder="Item 1 in Subheading 1 in Heading 1"></textarea>
                        <br>             
                    </div>
                    <button class="itemadder" onclick="addItem(1,1)" oninput="collectData(false,true)">Add Item</button>
                    <br>
                </div>
                <br>
                <button class="subheadingadder" onclick="addSubheading(1)" oninput="collectData(false,true)">Add Subheading</button>
            </div>
            <br>
            <button class="headingadder" onclick="addHeading()" oninput="collectData(false,true)">Add Heading</button>
            <br>
            <br>
            <button id="submit" onclick="collectData(true, false)">Submit</button>
        </div>
    </body>
</html>

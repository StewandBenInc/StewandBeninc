<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>©Stew and Ben inc.®™ </title>
        <link rel="icon" type="image/x-icon" href="/logo.png">
        <link rel="stylesheet" href="../style.css">
        <script src="../navbar.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
        <script src="recipesubmit.js"></script>
        <script src="/footer.js"></script>
    </head>
    <body>
        <div class="mainbody" style="margin-top: 75px;">
            <h1>Submit a Recipe</h1>
            <input type="text" id="name" required oninput="collectData(false,true)" placeholder="First and Last Name">
            <br>
            <input type="text" id="email" required oninput="collectData(false,true)" placeholder="Email Address">
            <br>
            <input type="text" id="subject" required oninput="collectData(false,true)" placeholder="Subject">
            <br>
            <input type="text" id="title" required oninput="collectData(false,true)" placeholder="Title">
            <br>
            <div id="dishs">
                <input type="text" id="dish1" class="dish" oninput="collectData(false,true)" required placeholder="Dish 1">
                <div id="partlistdish1">
                    <input type="text" id="part1dish1" oninput="collectData(false,true)" class="part" required placeholder="Part 1 in Dish 1">
                    <br>
                    <div id="steplistpart1dish1">
                        <textarea id="step1part1dish1" class="step" oninput="collectData(false,true)" required placeholder="Step 1 in Part 1 in Dish 1"></textarea>
                        <br>             
                    </div>
                    <button class="stepadder" onclick="addstep(1,1)" oninput="collectData(false,true)" onclick="loadData()">Add Step</button>
                    <br>
                </div>
                <br>
                <button class="partadder" onclick="addpart(1)" oninput="collectData(false,true)" onclick="loadData()">Add part</button>
            </div>
            <br>
            <button class="dishadder" onclick="adddish()" oninput="collectData(false,true)" onclick="loadData()">Add Dish</button>
            <br>
            <br>
            <button id="submit" onclick="collectData(true, false)" onclick="clearData()">Submit</button>
            <br>
            <br>
            <button id="clear" onclick="clearData()">Clear</button>
        </div>
    </body>
</html>

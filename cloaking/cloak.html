<div id="overlay">
<h3>Would you like to enable tab cloaking?</h3>
  <button onclick="toggleCloak()">Yes</button>
<script>
const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            //alert(urlParams.get("disable"))
            function getCookie(cname) {
                let name = cname + "=";
                let decodedCookie = decodeURIComponent(document.cookie);
                let ca = decodedCookie.split(';');
                for(let i = 0; i <ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                    }
                    if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                    }
                }
                return "";
            }
            function inIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }
            if ((! inIframe()) && getCookie("cloak") && (! urlParams.get("disable"))){
                //alert("ye")
                console.log(window.location.href);
                window.doCloak = true;
                if (cloak(window.location.href, true)){
                    window.location.replace("https://google.com");
                }
            }
            else {
                if (!inIframe()){
                    document.cookie = "cloak=";
                    window.doCloak = false;
                }
                else{
                    window.doCloak = true;
                }
            }
            function cloak(url, absolute){
                absolute = absolute || false;
                url = absolute ? url : window.location.href.replace(/\/$/, "") + url;
                if (window.doCloak){
                    //alert(url);
                    //alert("Opening " + url)
                    //Creates new ABC
                    var page = new ABC({
                        "type": "blank", //Blank, blob, or overwrite
                        "url": url //Any url
                    })
                    //Set the type
                    page.setType("blank");
                    //Set the url
                    page.setUrl(url);
                    //Get iframe code
                    page.getCode();
                    //Open page
                    var win = page.open();
                    if (!win || win.closed || typeof win.closed=='undefined'){ 
                        document.cookie = "cloak=";
                        window.doCloak = false;
                        alert("Fatal Error:\n\nNAME: ERR_POPUP_BLOCKED\nDESCRIPTION: Allow pop-ups to enable tab cloaking.")
                        return false;
                    }
                    return true;
                }
                else{
                    window.open(url);
                }
            }
        </script>
        <script x-alias-name="settings">
            function toggleCloak(){
                if (getCookie("cloak")){
                    document.cookie = "cloak=";
                    window.doCloak = false;
                    window.open(window.location);
                    window.open("https://google.com", "_top");
                }
                else{
                    document.cookie = "cloak=1";
                    window.doCloak = true;
                    window.location.reload();
                }
            }
        
</script>
</a>
<button onclick="off()">No</button>
</div>

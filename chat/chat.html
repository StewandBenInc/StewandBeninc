<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/logo.png">
  <title>©Stew and Ben inc.®™</title>
  <script src="https://chitchatter.im/sdk.js" defer></script>
  <script src="/navbar.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const chatRoom = params.get("roomId");

    window.addEventListener("DOMContentLoaded", () => {
      const chatElement = document.querySelector("chat-room");
      chatElement.setAttribute("room", chatRoom);
      console.log("chatloaded")
    });
  </script>

  <script src="/navbar.js"></script>

  <chat-room style="margin-top: 60px;" root-url="https://chitchatter.im/" play-message-sound="true" color-mode="dark"
    height="898h" width="99.8%">
  </chat-room>

  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
    window.addEventListener('DOMContentLoaded', () => {
      const username = getCookie("username");
      if (username) {
        const chat = document.querySelector('chat-room');
        if (chat) {
          chat.setAttribute('user-name', username);
        }
      }
    });

    function checkAccount() {
      if (getCookie("username")) {
        console.log("Account exists");
      } else {
        window.location.href = "/Signin/notallowed.html";
      }
    };
    window.onload = checkAccount()
  </script>

</body>

</html>

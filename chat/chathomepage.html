<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <title>©Stew and Ben inc.®™</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/ical.js@1.4.0/build/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.15/index.global.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="chat.css">
    <script src="chat.js" defer></script>
</head>

<body>
    <script src="/navbar.js"></script>
    <h1><b>Chat</b></h1>
    <div class="main">
        <div class="Create">
            <h3>Create or Join a Custom Room</h3>
            <input type="text" id="roomName" placeholder="Enter room name">
            <button id="createButton">Create Room</button>
        </div>
        <div class="Join">
            <h3>Join a Premade Room</h3>
            <label for="rooms">Choose a Room to Join:</label>
            <select name="rooms" id="join">
                <option value="math">Math Study Help</option>
                <option value="humanities">Humaities Study Help</option>
                <option value="science">Science Study Help</option>
                <option value="chill">Chill Room</option>
            </select>
            <button id="joinButton">Join Room</button>
        </div>
        <script src="/footer.js"></script>
</body>

</html>

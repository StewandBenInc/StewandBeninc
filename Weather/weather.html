<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>©Stew and Ben inc.®™ | NOAA Weather Forecast</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/Weather/weather.css">
</head>
<body>
    <script src="/navbar.js"></script>
    <script src="/Weather/weather.js"></script>
    <script src="/footer.js"></script>
    <div class="mainbody" id="forecast" style="margin-top: 75px;">
        <h1 id="place">Weather Forecast From NOAA</h1>
        <input type="text" id="locationInput" placeholder="Zip Code">
        <button id="searchButton">Search</button>
        <table id="forecasttable" class="mainforecastbody">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Temperature</th>
                    <th>Description</th>
                    <th>Wind</th>
                    <th>Precipitation</th>
                    <th>Humidity</th>
                </tr>
            </thead>
            <tbody id="data">
            </tbody>
        </table>
    </div>
</body>
</html>

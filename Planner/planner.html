<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planner Calendar</title>
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css' rel='stylesheet' />
  <style>
    body {
      display: flex;
      font-family: sans-serif;
      margin: 0;
      height: 100vh;
    }
    #sidebar {
      width: 300px;
      padding: 1em;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    #calendar {
      flex-grow: 1;
      padding: 1em;
    }
    .assignment {
      border-bottom: 1px solid #ccc;
      padding: 0.5em 0;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Assignments</h2>
    <div id="assignmentList"></div>
    <hr />
    <h3>Add Class</h3>
    <form id="classForm">
      <input type="text" placeholder="Class Name" id="className" required><br>
      <input type="time" id="classTime" required><br>
      <select id="classDay">
        <option value="0">Sunday</option><option value="1">Monday</option>
        <option value="2">Tuesday</option><option value="3">Wednesday</option>
        <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
      </select>
      <button type="submit">Add Class</button>
    </form>
    <h3>Add Free Time</h3>
    <form id="freeTimeForm">
      <select id="freeDay">
        <option value="0">Sunday</option><option value="1">Monday</option>
        <option value="2">Tuesday</option><option value="3">Wednesday</option>
        <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
      </select>
      <input type="time" id="freeStart" required>
      <input type="time" id="freeEnd" required>
      <button type="submit">Add Free Time</button>
    </form>
    <h3>Add Assignment</h3>
    <form id="assignmentForm">
      <input type="text" placeholder="Assignment" id="assignmentName" required><br>
      <input type="datetime-local" id="dueDate" required><br>
      <input type="number" placeholder="Duration (hrs)" id="duration" required><br>
      <label><input type="checkbox" id="priority"> Priority</label><br>
      <button type="submit">Add Assignment</button>
    </form>
  </div>
  <div id="calendar"></div>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js'></script>
  <script>
    let calendar;
    let assignments = JSON.parse(localStorage.getItem('assignments') || '[]');
    let classes = JSON.parse(localStorage.getItem('classes') || '[]');
    let freeTimes = JSON.parse(localStorage.getItem('freeTimes') || '[]');

    function saveData() {
      localStorage.setItem('assignments', JSON.stringify(assignments));
      localStorage.setItem('classes', JSON.stringify(classes));
      localStorage.setItem('freeTimes', JSON.stringify(freeTimes));
    }

    function renderAssignments() {
      const list = document.getElementById('assignmentList');
      list.innerHTML = '';
      assignments.sort((a, b) => new Date(a.due) - new Date(b.due));
      assignments.forEach((a, idx) => {
        const div = document.createElement('div');
        div.className = 'assignment';
        div.innerHTML = `<input type="checkbox" onchange="completeAssignment(${idx})"> <strong>${a.name}</strong><br>Due: ${new Date(a.due).toLocaleString()}`;
        list.appendChild(div);
      });
    }

    function completeAssignment(idx) {
      assignments.splice(idx, 1);
      saveData();
      renderAssignments();
      renderEvents();
    }

    function renderEvents() {
      const events = [];
      classes.forEach(cls => {
        events.push({
          title: cls.name,
          daysOfWeek: [cls.day],
          startTime: cls.time,
          endTime: (parseInt(cls.time.split(':')[0]) + 1) + ':' + cls.time.split(':')[1],
          startRecur: new Date().toISOString().split('T')[0]
        });
      });

      let availableSlots = JSON.parse(JSON.stringify(freeTimes));

      classes.forEach(cls => {
        let ft = availableSlots.find(f => f.day === parseInt(cls.day));
        if (!ft) return;
        ft.times = ft.times.flatMap(([start, end]) => {
          if (cls.time >= end || cls.time <= start) return [[start, end]];
          const classEnd = (parseInt(cls.time.split(':')[0]) + 1).toString().padStart(2, '0') + ':' + cls.time.split(':')[1];
          return [[start, cls.time], [classEnd, end]];
        });
      });

      assignments.forEach(a => {
        let remaining = a.duration;
        availableSlots.sort((a, b) => a.day - b.day);
        for (let ft of availableSlots) {
          for (let i = 0; i < ft.times.length; i++) {
            let [start, end] = ft.times[i];
            const startHour = parseInt(start.split(':')[0]);
            const endHour = parseInt(end.split(':')[0]);
            const slotLength = endHour - startHour;
            if (slotLength >= remaining) {
              const today = new Date();
              today.setDate(today.getDate() + ((ft.day - today.getDay() + 7) % 7));
              const dateStr = today.toISOString().split('T')[0];
              events.push({
                title: `📘 ${a.name}`,
                start: `${dateStr}T${start}`,
                end: `${dateStr}T${(startHour + remaining).toString().padStart(2, '0')}:00`
              });
              ft.times[i] = null;
              remaining = 0;
              break;
            }
          }
          ft.times = ft.times.filter(Boolean);
          if (remaining <= 0) break;
        }
      });

      calendar.removeAllEvents();
      events.forEach(e => calendar.addEvent(e));
    }

    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        allDaySlot: false
      });
      calendar.render();
      renderAssignments();
      renderEvents();

      document.getElementById('classForm').onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('className').value;
        const time = document.getElementById('classTime').value;
        const day = document.getElementById('classDay').value;
        classes.push({ name, time, day });
        saveData();
        renderEvents();
      };

      document.getElementById('freeTimeForm').onsubmit = (e) => {
        e.preventDefault();
        const day = parseInt(document.getElementById('freeDay').value);
        const start = document.getElementById('freeStart').value;
        const end = document.getElementById('freeEnd').value;
        let entry = freeTimes.find(f => f.day === day);
        if (!entry) {
          freeTimes.push({ day, times: [[start, end]] });
        } else {
          entry.times.push([start, end]);
        }
        saveData();
        renderEvents();
      };

      document.getElementById('assignmentForm').onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('assignmentName').value;
        const due = document.getElementById('dueDate').value;
        const duration = parseInt(document.getElementById('duration').value);
        const priority = document.getElementById('priority').checked;
        assignments.push({ name, due, duration, priority });
        saveData();
        renderAssignments();
        renderEvents();
      };
    });
  </script>
</body>
</html>

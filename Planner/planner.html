<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Homework Class Picker</title>
  <link rel="stylesheet" href="planner.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
  <script defer src="planner.js"></script>
</head>

<body>
<script src="/navbar.js"></script>
  <div class="page-wrapper">
    <div class="left-panel">
      <div id="calendar"></div>
    </div>

    <div class="right-panel">
      <h3>Assignments</h3>
      <ul id="assignmentList"></ul>
    </div>
  </div>

  <div class="forms-wrapper">
    <form onsubmit="return addClass()">
      <h4>Add Class</h4>
      <label>Subject :</label>
      <input type="text" id="class"><br>
      <label>Start Time:</label>
      <input type="time" id="classTime"><br>
      <label>Day(s):</label>
      <select id="classDay" multiple size="7">
        <option value="monday">Monday</option>
        <option value="tuesday">Tuesday</option>
        <option value="wednesday">Wednesday</option>
        <option value="thursday">Thursday</option>
        <option value="friday">Friday</option>
        <option value="saturday">Saturday</option>
        <option value="sunday">Sunday</option>
      </select><br><br>
      <input type="submit" value="Add Class">
    </form>

    <form onsubmit="return addFreeTime()">
      <h4>Add Free Time</h4>
      <label>Name of Free Period:</label>
      <input type="text" id="freeName"><br>
      <label>Start Time:</label>
      <input type="time" id="freeTimeStart"><br>
      <label>End Time:</label>
      <input type="time" id="freeTimeEnd"><br>
      <label>Day:</label>
      <select id="freeDay">
        <option value="monday">Monday</option>
        <option value="tuesday">Tuesday</option>
        <option value="wednesday">Wednesday</option>
        <option value="thursday">Thursday</option>
        <option value="friday">Friday</option>
        <option value="saturday">Saturday</option>
        <option value="sunday">Sunday</option>
      </select><br><br>
      <input type="submit" value="Add Free Time">
    </form>

    <form onsubmit="return addHomework()">
      <h4>Add Homework/Task</h4>
      <label>Name of Task:</label>
      <input type="text" id="taskName"><br>
      <label>Related Class:</label>
      <select id="taskClass"></select><br>
      <label>Due Date:</label>
      <input type="date" id="taskDue"><br>
      <label>Estimated Time (minutes):</label>
      <input type="number" id="taskTime" min="1"><br>
      <label>Priority:</label>
      <input type="checkbox" id="taskPriority"><br><br>
      <input type="submit" value="Add Homework">
    </form>
  </div>

</body>
</html>
